[project]
name = "una-gravedad"
version = "0.1.0"
description = "Un solo motor de gravedad en tres escalas: Sistema Solar, galaxia y Universo (AST101, Tarea 2)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
